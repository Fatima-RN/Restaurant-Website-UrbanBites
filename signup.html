<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Urban Bites - Sign Up</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-box">
      <div class="auth-brand">
        <div class="auth-logo-circle">UB</div>
        <div class="auth-logo">Urban <span>Bites</span></div>
      </div>
      <p class="auth-subtitle">Create your account and join our community.</p>
      <h2>Sign Up</h2>
      <form id="signupForm">
        <div class="auth-form-group">
          <label>Full Name</label>
          <input type="text" id="signupName" placeholder="Enter your full name">
          <div class="auth-error" id="signupNameErr">Name must be at least 3 characters</div>
        </div>
        <div class="auth-form-group">
          <label>Email Address</label>
          <input type="email" id="signupEmail" placeholder="Enter your email">
          <div class="auth-error" id="signupEmailErr">Valid email is required</div>
        </div>
        <div class="auth-form-group">
          <label>Password</label>
          <input type="password" id="signupPassword" placeholder="Create a password">
          <div class="auth-error" id="signupPassErr">Password must be at least 6 characters</div>
        </div>
        <div class="auth-form-group">
          <label>Confirm Password</label>
          <input type="password" id="signupConfirm" placeholder="Confirm your password">
          <div class="auth-error" id="signupConfirmErr">Passwords do not match</div>
        </div>
        <button type="submit" class="auth-btn">Create Account</button>
      </form>
      <div class="auth-switch">Already have an account? <a href="login.html">Login</a></div>
    </div>
  </div>
  <script src="productsdata.js"></script>
  <script src="app.js"></script>
</body>
</html>
